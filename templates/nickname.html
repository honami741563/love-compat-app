{% extends "base.html" %}
{% block title %}ニックネーム入力{% endblock %}
{% block content %}
<div class="center-card">
  <h1>結果を見る前に</h1>
  <p class="lead">シェア時に表示するニックネームを入力してください。</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('nickname') }}">
    <input type="text" name="nickname" maxlength="20" placeholder="例：ちゃむ" required class="text-input">
    <button type="submit" class="btn-primary">診断結果を見る</button>
  </form>
</div>
{% endblock %}
